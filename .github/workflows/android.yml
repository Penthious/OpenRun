name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify runner Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
      - run: python3 scripts/check_source.py
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - run: python3 scripts/check_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
