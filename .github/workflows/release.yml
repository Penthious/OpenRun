name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify runner Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
      - name: Verify tag matches app version
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'versionName = "([^"]+)"',Path("app/build.gradle.kts").read_text())[1]
          assert os.environ["GITHUB_REF_NAME"] == "v"+version, "Tag must match versionName"
          PY
      - run: python3 scripts/check_source.py
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENRUN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure release signing secrets first."; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openrun-release.jks"
      - name: Test and build signed release
        env:
          OPENRUN_KEYSTORE: ${{ runner.temp }}/openrun-release.jks
          OPENRUN_STORE_PASSWORD: ${{ secrets.OPENRUN_STORE_PASSWORD }}
          OPENRUN_KEY_ALIAS: ${{ secrets.OPENRUN_KEY_ALIAS }}
          OPENRUN_KEY_PASSWORD: ${{ secrets.OPENRUN_KEY_PASSWORD }}
        run: |
          test -n "$OPENRUN_STORE_PASSWORD"
          test -n "$OPENRUN_KEY_ALIAS"
          test -n "$OPENRUN_KEY_PASSWORD"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Verify and prepare release files
        run: |
          python3 scripts/check_apk.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenRun-$GITHUB_REF_NAME.apk"
          python3 scripts/release_metadata.py "dist/OpenRun-$GITHUB_REF_NAME.apk"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          zip -q -r dist/OpenRun-third-party-notices.zip third_party
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "OpenRun $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openrun-release.jks"
